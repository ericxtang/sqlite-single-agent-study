name: Validate replication package
on: [push, pull_request]
permissions:
  contents: read
jobs:
  no-inference:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python3 replication/manage.py verify
      - run: python3 -m unittest discover -s evaluator -p 'test_*.py'
      - run: python3 -m unittest discover -s replication -p 'test_*.py'
      - run: python3 -m unittest discover -s evaluator_v2 -p 'test_*.py'
      - run: python3 replication/validate_publication.py
